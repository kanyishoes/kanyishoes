<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Orders</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="bg-gray-100">
  <header class="bg-white shadow sticky top-0 z-50">
    <div class="max-w-7xl mx-auto p-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold">Orders</h1>
        <p class="text-sm text-gray-500">Customer orders</p>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4">
    <div class="overflow-x-auto bg-white rounded shadow">
      <table class="min-w-full" id="ordersTable">
        <thead class="bg-blue-900 text-white">
          <tr>
            <th class="p-3 text-left">Order ID</th>
            <th class="p-3 text-left">Customer</th>
            <th class="p-3 text-left">Items</th>
            <th class="p-3 text-left">Total</th>
            <th class="p-3 text-left">Status</th>
            <th class="p-3 text-left">Created</th>
          </tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>
  </main>

  <script type="module" src="./js/orders.js"></script>
</body>
</html>
