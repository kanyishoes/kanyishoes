<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kanye Series</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <!-- Swiper CSS -->
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

    <style>
        /* Smooth transitions for luxury feel */
        * {
            transition: all 0.3s ease;
        }
        
        /* Sidebar hover effects (Tailwind @apply isn't available in-browser so expand necessary rules) */
        .nav-item{
            position:relative; padding:1rem 1rem; display:flex; flex-direction:column; gap:.75rem; color:#4b5563; cursor:pointer; border-radius:0.5rem;
        }
        .nav-item:hover{ color:#1e3a8a; background-color:#ebf8ff; }
        .nav-item.active{ background:linear-gradient(90deg,#1e3a8a,#1e40af); color:white; box-shadow:0 10px 25px rgba(2,6,23,.6); }
        .nav-item i{ font-size:1.25rem; transition:transform .2s; }
        .nav-label{ font-size:.75rem; font-weight:600; }

        /* Product card hover effect */
        .product-card{ transition:all .3s ease; }
        .product-card:hover{ box-shadow:0 30px 60px rgba(2,6,23,.12); transform:translateY(-.5rem); }

        /* Category card enhanced */
        .category-card{ transition:all .3s ease; }
        .category-card:hover{ box-shadow:0 20px 40px rgba(2,6,23,.08); }

        /* Contact info card */
        .contact-info-item{ padding:1rem; border-radius:1rem; background:rgba(255,255,255,.06); backdrop-filter:blur(6px); transition:all .3s ease; }
        .contact-info-item:hover{ background:rgba(255,255,255,.12); transform:scale(1.03); }

        /* Utility for truncated text where original used Tailwind truncate */
        .truncate{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

        /* Responsive fixes for elements that used @apply and Tailwind variants in original */
        @media(min-width:1024px){ .nav-item{ flex-direction:row; align-items:center; } .nav-item i{ font-size:1.5rem; } }
    </style>
</head>

        <!-- DESKTOP LEFT SIDEBAR NAVIGATION -->
        <nav class="hidden lg:flex fixed left-0 top-0 h-screen w-24 bg-gradient-to-b from-blue-950 via-blue-900 to-blue-950 shadow-2xl flex-col items-center pt-8 pb-8 z-40 border-r border-blue-800">
            
            <!-- Logo -->
            <div class="mb-12 text-center">

            </div>

                    </div>
                </a>

                        </div>

                            </button>

                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- PAGE SPACING -->
            <div class="h-20 md:h-24"></div>

            <!-- SEARCH BAR -->
            <div id="searchContainer" class="hidden px-4 py-4 sticky top-20 lg:top-24 z-40 bg-white/95 backdrop-blur-sm shadow-sm">
