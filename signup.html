<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign up — Kanye Series</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md bg-white rounded-2xl p-8 shadow">
    <h1 class="text-2xl font-bold mb-6 text-blue-900">Create account</h1>
    <form id="signupForm" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-600">Full name</label>
        <input id="signupName" class="w-full px-3 py-2 border rounded" required />
      </div>
      <div>
        <label class="block text-sm text-gray-600">Email</label>
        <input id="signupEmail" type="email" class="w-full px-3 py-2 border rounded" required />
      </div>
      <div>
        <label class="block text-sm text-gray-600">Password</label>
        <input id="signupPassword" type="password" class="w-full px-3 py-2 border rounded" minlength="6" required />
      </div>
      <button type="submit" class="w-full bg-blue-900 text-white py-3 rounded-xl">Sign up</button>
    </form>
    <p class="text-center text-sm text-gray-600 mt-4">
      Already have an account?
      <a href="signin.html" class="text-blue-900 font-semibold">Sign in</a>
    </p>
  </div>

  <!-- auth module (uses js/firebase.js internally) -->
  <script type="module" src="js/auth.js"></script>
</body>
</html>
