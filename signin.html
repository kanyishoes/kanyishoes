<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign in — Kanye Series</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <header class="w-full">
    <div class="max-w-7xl mx-auto flex items-center justify-between p-4">
      <a href="index.html" class="text-xl font-bold text-blue-900">Kanye Series</a>
      <!-- auth link inserted by js/auth.js -->
    </div>
  </header>

  <main class="w-full max-w-md bg-white rounded-2xl p-8 shadow">
    <h1 class="text-2xl font-bold mb-6 text-blue-900">Sign in</h1>
    <form id="signinForm" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-600">Email</label>
        <input id="signinEmail" type="email" class="w-full px-3 py-2 border rounded" required />
      </div>
      <div>
        <label class="block text-sm text-gray-600">Password</label>
        <input id="signinPassword" type="password" class="w-full px-3 py-2 border rounded" minlength="6" required />
      </div>
      <button type="submit" class="w-full bg-blue-900 text-white py-3 rounded-xl">Sign in</button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-4">
      Don't have an account?
      <a href="signup.html" class="text-blue-900 font-semibold">Create account</a>
    </p>
  </main>

  <!-- auth module (uses js/firebase.js internally) -->
  <script type="module" src="js/auth.js"></script>
</body>
</html>
